<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get Hebrew - Lyrics JSON Builder</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 24px;
      background: #f7f7f7;
      color: #222;
    }

    h1 { margin-bottom: 8px; }

    .note {
      margin-bottom: 18px;
      color: #555;
      line-height: 1.4;
      max-width: 1100px;
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
      align-items: end;
      background: white;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 14px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    label {
      font-weight: bold;
      color: #333;
      font-size: 14px;
    }

    select, input[type="text"] {
      min-width: 110px;
      padding: 9px;
      font-size: 16px;
      border: 1px solid #aaa;
      border-radius: 4px;
      background: white;
    }

    #manualRefInput, #titleInput {
      width: 280px;
      max-width: 100%;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 4px;
      background: royalblue;
      color: white;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
    }

    button:hover { background: navy; }

    .secondary-btn { background: darkgreen; }
    .secondary-btn:hover { background: green; }

    .translit-toggle-btn {
      background: darkslateblue;
      color: white;
      margin-left: 18px;
    }

    .translit-toggle-btn:hover {
      background: indigo;
    }

    .paragraph-toggle-btn {
      background: saddlebrown;
      color: white;
      margin-left: 12px;
    }

    .paragraph-toggle-btn:hover {
      background: sienna;
    }

    .translit-hidden,
    .details-hidden {
      display: none;
    }

    .trope-choice-group {
      display: flex;
      gap: 6px;
    }

    .trope-choice-btn {
      background: #777;
      min-width: 130px;
    }

    .trope-choice-btn:hover {
      background: #555;
    }

    .trope-choice-btn.active {
      background: maroon;
    }

    .trope-choice-btn.active:hover {
      background: #600000;
    }

.dual-btn {
  background: #5bc0de;
  color: white;
}

.dual-btn:hover {
  background: #31b0d5;
}

.dual-btn.active {
  background: royalblue;
}

.dual-btn.active:hover {
  background: navy;
}


    .generated-ref {
      margin: 8px 0 12px 0;
      font-size: 16px;
      color: #333;
    }

    .generated-ref span {
      font-family: Consolas, monospace;
      font-weight: bold;
      color: maroon;
    }

    .status {
      min-height: 22px;
      margin: 10px 0 16px 0;
      color: #444;
      font-weight: bold;
    }

    .section-title {
      margin-top: 24px;
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 18px;
    }

    .line-panel {
      background: white;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .line-title {
      font-weight: bold;
      margin-bottom: 8px;
      color: #444;
    }

    .source-hebrew {
      direction: rtl;
      unicode-bidi: isolate;
      text-align: right;
      font-family: "Times New Roman", Times, serif;
      font-size: 30px;
      line-height: 1.8;
      color: royalblue;
      padding: 8px;
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 4px;
      margin-bottom: 10px;
    }

    .word-grid {
      display: grid;
      grid-template-columns: minmax(160px, 280px) minmax(180px, 1fr);
      gap: 8px;
      align-items: center;
      margin-top: 8px;
    }

    /*
      This must appear after .word-grid because .word-grid sets display:grid.
      Otherwise the later display:grid wins and the rows remain visible.
    */
    .word-grid.details-hidden,
    .small-note.details-hidden {
      display: none;
    }

    .word-hebrew {
      direction: rtl;
      unicode-bidi: isolate;
      text-align: right;
      font-family: "Times New Roman", Times, serif;
      font-size: 26px;
      color: royalblue;
      padding: 6px 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #fbfbfb;
    }

    .word-translit {
      padding: 8px;
      font-size: 16px;
      border: 1px solid #aaa;
      border-radius: 4px;
      width: 95%;
    }

    .small-note {
      font-size: 13px;
      color: #666;
      margin-top: 6px;
    }

    pre {
      background: #1f1f1f;
      color: #e8e8e8;
      padding: 14px;
      border-radius: 6px;
      overflow-x: auto;
      white-space: pre-wrap;
      font-size: 14px;
    }

/* =========================================
   I_Sokie Splash Screen
   ========================================= */

#splash-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;

    background-color: #BEE3F4;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    z-index: 99999;
    transition: opacity 2s ease;
}

#splash-screen img {
    width: 70vw;
    height: 65vh;
    object-fit: contain;
    flex-shrink: 1;
}

.splash-title {
    font-family: "Lucida Calligraphy", cursive;
    font-weight: bold;
    font-size: 37px;
    letter-spacing: 2px;
    color: darkred;
    text-align: center;

    position: absolute;
    top: 25%;
    left: 50%;
    transform: translateX(-50%);

    width: 90%;
    margin: 0;
    z-index: 2;
}


/* =========================================
   Main Application Splash Transition
   ========================================= */

#main-app-dom {
    opacity: 0;
    pointer-events: none;
    transition: opacity 2s ease;
}

#main-app-dom.visible {
    opacity: 1;
    pointer-events: auto;
}

    /* =========================================
       Pocket Torah Options modal — UI shell only
       ========================================= */

    .pocket-torah-link {
      display: inline-block;
      margin-left: 150px;
      color: #0645ad;
      text-decoration: underline;
      cursor: pointer;
      font-weight: normal;
    }

    .pocket-torah-link:hover,
    .pocket-torah-link:focus {
      color: #0b57d0;
    }

    .pt-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100000;
      background: rgba(0, 0, 0, 0.48);
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .pt-modal:target {
      display: flex;
    }

    .pt-modal-panel {
      width: min(760px, 94vw);
      max-height: 90vh;
      overflow-y: auto;
      background: #fff;
      border: 1px solid #888;
      border-radius: 10px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28);
      padding: 22px 26px 24px;
      position: relative;
    }

    .pt-modal-title {
      margin: 0 0 20px 0;
      font-size: 24px;
    }

    .pt-modal-close {
      position: absolute;
      top: 12px;
      right: 16px;
      font-size: 28px;
      line-height: 1;
      color: #555;
      text-decoration: none;
    }

    .pt-modal-row {
      display: flex;
      align-items: flex-end;
      gap: 28px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .pt-modal-field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .pt-modal-field label,
    .pt-reading-label {
      font-weight: bold;
      color: #333;
    }

    #ptParshaSelect {
      min-width: 220px;
      padding: 7px 9px;
      font-size: 15px;
    }

    #ptAliyahSelect {
      min-width: 100px;
      padding: 7px 9px;
      font-size: 15px;
    }

    .pt-reading-options {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      align-items: center;
      padding-bottom: 5px;
    }

    .pt-reading-options label {
      white-space: nowrap;
      font-weight: normal;
    }

    .pt-reference-box {
      border-top: 1px solid #ddd;
      border-bottom: 1px solid #ddd;
      padding: 16px 0;
      margin: 8px 0 18px;
    }

    .pt-reference-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(90px, 1fr));
      gap: 12px;
    }

    .pt-reference-value {
      min-height: 22px;
      padding: 7px 8px;
      border: 1px solid #bbb;
      border-radius: 4px;
      background: #f7f7f7;
      color: #777;
    }

    .pt-action-row {
      display: flex;
      gap: 34px;
      flex-wrap: wrap;
      align-items: center;
    }

    .pt-action-placeholder {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #777;
    }

    .pt-action-icon {
      font-size: 22px;
      line-height: 1;
    }

    @media (max-width: 720px) {
      .pocket-torah-link {
        margin-left: 30px;
      }

      .pt-reference-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

  </style>
</head>
<body>
<div id="main-app-dom">
  <h1>Sefaria Lyrics JSON Builder</h1>
<!--
  <div class="note">
    This test page fetches Hebrew from Sefaria using the selected trope type and outputs the exact lyrics JSON structure used by the Trope app:
    <b>{ title, lines: [ { line, words: [ { hebrew, translit } ] } ] }</b>.
    The full Hebrew verse is preserved for visibility. The derived JSON word objects are hidden on load and can be shown with the Word Details button.
    Paragraph markers such as <b>{s}</b>, <b>{p}</b>, <b>{ס}</b>, <b>{פ}</b>, pasik/vertical separators, and standalone punctuation are ignored as transliteration objects.
  </div>
-->
  <div class="controls">
    <div class="control-group">
      <label for="bookSelect">Book</label>
      <select id="bookSelect"></select>
    </div>

    <div class="control-group">
      <label for="chapterSelect">Chapter</label>
      <select id="chapterSelect"></select>
    </div>

    <div class="control-group">
      <label for="startVerseSelect">Start verse</label>
      <select id="startVerseSelect"></select>
    </div>

    <div class="control-group">
      <label for="endVerseSelect">End verse</label>
      <select id="endVerseSelect"></select>
    </div>

    <div class="control-group">
      <label>Trope Type</label>

   <div class="trope-choice-group">
  <button id="lowerTropeBtn" type="button"  class="trope-choice-btn active">  Lower / Tahton  </button>
  <button id="upperTropeBtn"   type="button" class="trope-choice-btn">    Upper / Elyon  </button>
  <button id="dualTropeBtn"    type="button"   class="trope-choice-btn dual-btn">   Dual  </button>
</div>
    </div>

    <div class="control-group">
      <label for="titleInput">JSON title</label>
      <input id="titleInput" type="text" placeholder="Example: Genesis 2:3-8" />
    </div>

    <button id="fetchBtn">Get Hebrew</button>
    <button id="refreshJsonBtn" class="secondary-btn">Refresh JSON</button>
    <button id="copyJsonBtn" class="secondary-btn">Copy JSON</button>
    <button id="saveJsonBtn" class="secondary-btn">Save JSON</button>
    <button id="downloadDocBtn" class="secondary-btn">Download Document</button>
  </div>

  <div class="generated-ref">
    Sefaria ref to fetch: <span id="generatedRefDisplay"></span>
    <a class="pocket-torah-link" href="#pocketTorahModal">Use Pocket Torah</a>
  </div>

  <div class="controls">
    <div class="control-group">
      <label for="manualRefInput">Optional manual ref</label>
      <input id="manualRefInput" type="text" placeholder="Example: Genesis 2:3-8" />
    </div>
    <button id="manualFetchBtn">Fetch Manual Ref</button>
    <button id="toggleTranslitBtn" class="translit-toggle-btn">Show Word Details</button>
    <button id="toggleParagraphBtn" class="paragraph-toggle-btn">Show Paragraphs</button>
  </div>

  <div id="status" class="status"></div>

<div class="section-title">Hebrew Lines and Editable Transliteration</div>
<div id="sourceAttribution" class="small-note"></div>
<div id="lineEditor"></div>

  <div class="section-title">Lyrics JSON</div>
  <pre id="jsonOutput">{}</pre>
  <div id="downloadDocument" style="display:none;"></div>
  <script src="PT.js?v=20260923J"></script>
  <script src="Sefaria.js?v=20260923J"></script>
</div>
  <!--
    Pocket Torah Options modal.
    This is currently a UI shell only:
      - Parsha list will later be populated from aliyah.json.
      - Reading selection will later drive PT.js.
      - Reference fields will later display calculated PT values.
      - Audio and Hebrew-text actions are placeholders only.
  -->
  <div id="pocketTorahModal" class="pt-modal" role="dialog"
       aria-modal="true" aria-labelledby="pocketTorahModalTitle">
    <div class="pt-modal-panel">
      <a class="pt-modal-close" href="#" aria-label="Close Pocket Torah Options">&times;</a>

      <h2 id="pocketTorahModalTitle" class="pt-modal-title">Pocket Torah Options</h2>

      <div class="pt-modal-row">
        <div class="pt-modal-field">
          <label for="ptParshaSelect">Select Parsha</label>
          <select id="ptParshaSelect">
            <option value="" selected>Select Parsha</option>
          </select>
        </div>

        <div class="pt-modal-field">
          <label for="ptAliyahSelect">Aliyah</label>
          <select id="ptAliyahSelect">
            <option value="-1" selected>Select Aliyah</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="M">M</option>
          </select>
        </div>

        <div class="pt-modal-field">
          <span class="pt-reading-label">Reading</span>
          <div class="pt-reading-options">
            <label><input type="radio" name="ptReading" value="full" checked> Full K'riyah</label>
            <label><input type="radio" name="ptReading" value="triennial1"> Triennial-1</label>
            <label><input type="radio" name="ptReading" value="triennial2"> Triennial-2</label>
            <label><input type="radio" name="ptReading" value="triennial3"> Triennial-3</label>
          </div>
        </div>
      </div>

      <div class="pt-reference-box">
        <div class="pt-reference-grid">
          <div class="pt-modal-field">
            <label>Book</label>
            <div id="ptBookDisplay" class="pt-reference-value">&nbsp;</div>
          </div>
          <div class="pt-modal-field">
            <label>Starting Chapter</label>
            <div id="ptStartChapterDisplay" class="pt-reference-value">&nbsp;</div>
          </div>
          <div class="pt-modal-field">
            <label>Starting Verse</label>
            <div id="ptStartVerseDisplay" class="pt-reference-value">&nbsp;</div>
          </div>
          <div class="pt-modal-field">
            <label>Ending Chapter</label>
            <div id="ptEndChapterDisplay" class="pt-reference-value">&nbsp;</div>
          </div>
          <div class="pt-modal-field">
            <label>Ending Verse</label>
            <div id="ptEndVerseDisplay" class="pt-reference-value">&nbsp;</div>
          </div>
        </div>
      </div>

      <div class="pt-action-row">
        <button type="button" id="ptAudioToggle" class="pt-action-placeholder"
                aria-label="Play Pocket Torah audio" aria-pressed="false"
                style="border:0; background:none; padding:0; font:inherit; cursor:pointer;">
          <span id="ptAudioToggleIcon" class="pt-action-icon">&#9654;</span>
          <span>Click to play/stop Audio</span>
        </button>

        <button type="button" id="ptGetHebrewText" class="pt-action-placeholder"
                style="border:0; background:none; padding:0; font:inherit; cursor:pointer;">
          <span class="pt-action-icon">&#128196;</span>
          <span>Get Parsha Hebrew Text</span>
        </button>
      </div>
    </div>
  </div>

<div id="splash-screen">

    <h2 class="splash-title">
        From the workshop of I_Sokie Enterprises
    </h2>

    <img src="ISokieButton.svg" alt="I_Sokie Enterprises">

</div>
</body>
</html>
