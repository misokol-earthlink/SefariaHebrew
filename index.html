<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get Hebrew - Lyrics JSON Builder</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 24px;
      background: #f7f7f7;
      color: #222;
    }

    h1 { margin-bottom: 8px; }

    .note {
      margin-bottom: 18px;
      color: #555;
      line-height: 1.4;
      max-width: 1100px;
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
      align-items: end;
      background: white;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 14px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    label {
      font-weight: bold;
      color: #333;
      font-size: 14px;
    }

    select, input[type="text"] {
      min-width: 110px;
      padding: 9px;
      font-size: 16px;
      border: 1px solid #aaa;
      border-radius: 4px;
      background: white;
    }

    #manualRefInput, #titleInput {
      width: 280px;
      max-width: 100%;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 4px;
      background: royalblue;
      color: white;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
    }

    button:hover { background: navy; }

    .secondary-btn { background: darkgreen; }
    .secondary-btn:hover { background: green; }

    .translit-toggle-btn {
      background: darkslateblue;
      color: white;
      margin-left: 18px;
    }

    .translit-toggle-btn:hover {
      background: indigo;
    }

    .paragraph-toggle-btn {
      background: saddlebrown;
      color: white;
      margin-left: 12px;
    }

    .paragraph-toggle-btn:hover {
      background: sienna;
    }

    .translit-hidden,
    .details-hidden {
      display: none;
    }

    .trope-choice-group {
      display: flex;
      gap: 6px;
    }

    .trope-choice-btn {
      background: #777;
      min-width: 130px;
    }

    .trope-choice-btn:hover {
      background: #555;
    }

    .trope-choice-btn.active {
      background: maroon;
    }

    .trope-choice-btn.active:hover {
      background: #600000;
    }

.dual-btn {
  background: #5bc0de;
  color: white;
}

.dual-btn:hover {
  background: #31b0d5;
}

.dual-btn.active {
  background: royalblue;
}

.dual-btn.active:hover {
  background: navy;
}


    .generated-ref {
      margin: 8px 0 12px 0;
      font-size: 16px;
      color: #333;
    }

    .generated-ref span {
      font-family: Consolas, monospace;
      font-weight: bold;
      color: maroon;
    }

    .status {
      min-height: 22px;
      margin: 10px 0 16px 0;
      color: #444;
      font-weight: bold;
    }

    .section-title {
      margin-top: 24px;
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 18px;
    }

    .line-panel {
      background: white;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .line-title {
      font-weight: bold;
      margin-bottom: 8px;
      color: #444;
    }

    .source-hebrew {
      direction: rtl;
      unicode-bidi: isolate;
      text-align: right;
      font-family: "Times New Roman", Times, serif;
      font-size: 30px;
      line-height: 1.8;
      color: royalblue;
      padding: 8px;
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 4px;
      margin-bottom: 10px;
    }

    .word-grid {
      display: grid;
      grid-template-columns: minmax(160px, 280px) minmax(180px, 1fr);
      gap: 8px;
      align-items: center;
      margin-top: 8px;
    }

    /*
      This must appear after .word-grid because .word-grid sets display:grid.
      Otherwise the later display:grid wins and the rows remain visible.
    */
    .word-grid.details-hidden,
    .small-note.details-hidden {
      display: none;
    }

    .word-hebrew {
      direction: rtl;
      unicode-bidi: isolate;
      text-align: right;
      font-family: "Times New Roman", Times, serif;
      font-size: 26px;
      color: royalblue;
      padding: 6px 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #fbfbfb;
    }

    .word-translit {
      padding: 8px;
      font-size: 16px;
      border: 1px solid #aaa;
      border-radius: 4px;
      width: 95%;
    }

    .small-note {
      font-size: 13px;
      color: #666;
      margin-top: 6px;
    }

    pre {
      background: #1f1f1f;
      color: #e8e8e8;
      padding: 14px;
      border-radius: 6px;
      overflow-x: auto;
      white-space: pre-wrap;
      font-size: 14px;
    }

/* =========================================
   I_Sokie Splash Screen
   ========================================= */

#splash-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;

    background-color: #BEE3F4;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    z-index: 99999;
    transition: opacity 2s ease;
}

#splash-screen img {
    width: 70vw;
    height: 65vh;
    object-fit: contain;
    flex-shrink: 1;
}

.splash-title {
    font-family: "Lucida Calligraphy", cursive;
    font-weight: bold;
    font-size: 37px;
    letter-spacing: 2px;
    color: darkred;
    text-align: center;

    position: absolute;
    top: 25%;
    left: 50%;
    transform: translateX(-50%);

    width: 90%;
    margin: 0;
    z-index: 2;
}


/* =========================================
   Main Application Splash Transition
   ========================================= */

#main-app-dom {
    opacity: 0;
    pointer-events: none;
    transition: opacity 2s ease;
}

#main-app-dom.visible {
    opacity: 1;
    pointer-events: auto;
}
  </style>
</head>
<body>
<div id="main-app-dom">
  <h1>Sefaria Lyrics JSON Builder</h1>
<!--
  <div class="note">
    This test page fetches Hebrew from Sefaria using the selected trope type and outputs the exact lyrics JSON structure used by the Trope app:
    <b>{ title, lines: [ { line, words: [ { hebrew, translit } ] } ] }</b>.
    The full Hebrew verse is preserved for visibility. The derived JSON word objects are hidden on load and can be shown with the Word Details button.
    Paragraph markers such as <b>{s}</b>, <b>{p}</b>, <b>{ס}</b>, <b>{פ}</b>, pasik/vertical separators, and standalone punctuation are ignored as transliteration objects.
  </div>
-->
  <div class="controls">
    <div class="control-group">
      <label for="bookSelect">Book</label>
      <select id="bookSelect"></select>
    </div>

    <div class="control-group">
      <label for="chapterSelect">Chapter</label>
      <select id="chapterSelect"></select>
    </div>

    <div class="control-group">
      <label for="startVerseSelect">Start verse</label>
      <select id="startVerseSelect"></select>
    </div>

    <div class="control-group">
      <label for="endVerseSelect">End verse</label>
      <select id="endVerseSelect"></select>
    </div>

    <div class="control-group">
      <label>Trope Type</label>

   <div class="trope-choice-group">
  <button id="lowerTropeBtn" type="button"  class="trope-choice-btn active">  Lower / Tahton  </button>
  <button id="upperTropeBtn"   type="button" class="trope-choice-btn">    Upper / Elyon  </button>
  <button id="dualTropeBtn"    type="button"   class="trope-choice-btn dual-btn">   Dual  </button>
</div>
    </div>

    <div class="control-group">
      <label for="titleInput">JSON title</label>
      <input id="titleInput" type="text" placeholder="Example: Genesis 2:3-8" />
    </div>

    <button id="fetchBtn">Get Hebrew</button>
    <button id="refreshJsonBtn" class="secondary-btn">Refresh JSON</button>
    <button id="copyJsonBtn" class="secondary-btn">Copy JSON</button>
    <button id="downloadDocBtn" class="secondary-btn">Download Document</button>
  </div>

  <div class="generated-ref">
    Sefaria ref to fetch: <span id="generatedRefDisplay"></span>
  </div>

  <div class="controls">
    <div class="control-group">
      <label for="manualRefInput">Optional manual ref</label>
      <input id="manualRefInput" type="text" placeholder="Example: Genesis 2:3-8" />
    </div>
    <button id="manualFetchBtn">Fetch Manual Ref</button>
    <button id="toggleTranslitBtn" class="translit-toggle-btn">Show Word Details</button>
    <button id="toggleParagraphBtn" class="paragraph-toggle-btn">Show Paragraphs</button>
  </div>

  <div id="status" class="status"></div>

<div class="section-title">Hebrew Lines and Editable Transliteration</div>
<div id="sourceAttribution" class="small-note"></div>
<div id="lineEditor"></div>

  <div class="section-title">Lyrics JSON</div>
  <pre id="jsonOutput">{}</pre>
  <div id="downloadDocument" style="display:none;"></div>
  <script src="PT.js?v=20260922A"></script>
  <script src="Sefaria.js?v=20260922A"></script>
</div>
<div id="splash-screen">

    <h2 class="splash-title">
        From the workshop of I_Sokie Enterprises
    </h2>

    <img src="ISokieButton.svg" alt="I_Sokie Enterprises">

</div>
</body>
</html>
